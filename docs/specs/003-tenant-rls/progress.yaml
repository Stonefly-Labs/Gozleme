- {at: '2026-11-15', by: maintainer, topic: rls-identity-binding, decision: 'DB-verified signed account context: app signs a short-lived per-transaction account context; a security-definer helper verifies it with a key gozleme_app cannot read; policies re-check membership in the DB; forged/stale/tampered/expired context identifies nobody'}
- {at: '2026-11-15', by: maintainer, topic: force-rls, decision: 'FORCE ROW LEVEL SECURITY on every tenant-owned table; migrations DDL-only, future data migrations set context explicitly; test owner and app roles'}
- {at: '2026-11-15', by: maintainer, topic: seed-context, decision: 'Operator seed acts as a seeded member account of each demo organization; no new role or privilege'}
- {at: '2026-11-15', by: maintainer, topic: tenant-id-on-spans, decision: 'Keep GOZ-0002 precedent: gozleme.organization.id on spans only after membership confirmed, never a metric label'}
- {at: '2026-11-16', by: maintainer, topic: GOZ-0003-IF-03, decision: 'Option A: a reviewed migration may lift the owner binding only inside its own transaction (the transaction-local gozleme.rls_helper flag, or ALTER TABLE ... NO FORCE then FORCE), with a superuser test asserting per-row results. A migration may never disable a guard trigger: guarded columns are not backfilled, and a needed change extends the guard in a new migration.'}
- {at: '2026-11-16', by: maintainer, topic: GOZ-0003-IF-04, decision: 'Option A: non-account principals use a second signed token kind naming one organization and a bounded purpose, verified in the database with the same key and admitted by a new policy branch pinned by the catalog check. First consumer GOZ-0015.'}
- {at: '2026-11-16', by: maintainer, topic: GOZ-0003-IF-08, decision: 'Option B: a fourth table class (for example InstanceReference) for tables with no organization_id and no tenant content, with no DML for gozleme_app except a pinned read path, enforced by its own RlsCatalog rule. Added by the first spec that needs it.'}
- {at: '2026-11-16', by: maintainer, topic: GOZ-0003-IF-11, decision: 'Option A: backup and restore run as a superuser, as a documented operator procedure. The key-rotation gap (accept as residual vs versioned keys) was not decided and stays open for GOZ-0039 clarification.'}
- {at: '2026-11-16', by: maintainer, topic: GOZ-0003-IF-15, decision: 'Option A: fix GOZ-0003-OBS-01 in a bounded bugfix PR (bugfix/goz-0001-resign-in-session) against GOZ-0001 behaviour before GOZ-0040 starts, with a non-incidental regression test using both the old and the new cookie after re-sign-in.'}
