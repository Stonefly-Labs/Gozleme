decisions:
- {at: '2026-11-17', by: maintainer, topic: persistence, decision: 'Q1 option A: validate only; a manifest is validated against a registered capability (identity claim checked) and returns envelope, verbatim native document and a separate normalized projection; nothing is stored; GOZ-0007 adds storage as immutable revisions.'}
- {at: '2026-11-17', by: maintainer, topic: action-role, decision: 'Q2 option A: new action manifest.validate held by publisher only; suspended publishers answer 409.'}
- {at: '2026-11-17', by: maintainer, topic: native-formats, decision: 'Q3 option A: MCP Registry server.json; A2A Agent Card (current stable); OpenAPI 3.1 plus 3.0; AsyncAPI 3.0; Agent Skills SKILL.md front matter; Gozleme-defined typed model card; one pinned version per adapter, later versions added as new adapter versions; plan pins exact versions.'}
- {at: '2026-11-17', by: maintainer, topic: strictness, decision: 'Q4 option A: strict categorized rejection; envelope rejects unknown fields; reserved security claims (signatures, attestations, trust/verified/approved status, delegation and transfer chains, visibility and grants, owner/publisher overrides) rejected; inline secret values rejected, secret references allowed; native unknown fields allowed only under the protocol extension mechanism, preserved verbatim, never projected.'}
- {at: '2026-11-17', by: maintainer, topic: native-carriage, decision: 'Clarify Q1 option A: native document always a string in the envelope; native bytes are its UTF-8; digest over exactly those bytes.'}
- {at: '2026-11-17', by: maintainer, topic: native-encoding, decision: 'Clarify Q2 option A: OpenAPI and AsyncAPI accept JSON or restricted YAML; server.json, A2A Agent Card and model card JSON only; envelope declares native encoding; mismatch is malformed.'}
- {at: '2026-11-17', by: maintainer, topic: secret-detection, decision: 'Clarify Q3 option A (first chose B with entropy heuristic, then reversed same session): non-empty values in secret-bearing fields plus a fixed documented credential pattern list in any field; no entropy heuristic.'}
- {at: '2026-11-17', by: maintainer, topic: problem-location, decision: 'Clarify Q4 option A: location is part (envelope|native) plus RFC 6901 JSON Pointer; malformed gives line/column in the native string; too_large has no location.'}
- {at: '2026-11-17', by: maintainer, topic: schema-validator, decision: 'Plan P1: Corvus.Json.Validator (Apache-2.0) validates native documents against bundled official schemas (drafts 4/7/2020-12); JsonSchema.Net rejected (OSMF EULA licence, no draft-04); hand-written validators rejected.'}
- {at: '2026-11-17', by: maintainer, topic: yaml-parser, decision: 'Plan P2: YamlDotNet low-level Parser event stream only; Gozleme rejects anchors, aliases, tags and merge keys and enforces duplicate keys, depth and size while building its own tree.'}
- {at: '2026-11-17', by: maintainer, topic: asyncapi-pin, decision: 'Plan P3: AsyncAPI 3.0.0 as decided in Q3; 3.1.0 (released 2026-01-31) is added later as a new adapter version.'}
- {at: '2026-11-17', by: maintainer, topic: mcp-format, decision: 'Plan P4: server.json 2025-12-11 lists no tools/resources/prompts and the maintainer asked for a more modern pin considering stateful and stateless MCP; chose "Revision-typed, both": a Gozleme-versioned MCP server manifest whose serverInfo, capabilities, tools, resources, resource templates and prompts are validated against the official core schema of the declared protocolRevision, 2026-07-28 (stateless, SEP-2575/2567) or 2025-11-25 (stateful, sessions); projection mode derived from the revision; optional remotes/packages use server.json 2025-12-11 shapes; primitive lists publisher-declared and advisory.'}
- {at: '2026-11-17', by: maintainer, topic: blocker-B1, decision: 'GOZ-0006-B1: spike the Corvus V5 (Corvus.Text.Json) family against T002 checks (a)-(d) plus an AsyncAPI 3.0.0 compile and report back before P1 is revisited; no plan change yet.'}
- {at: '2026-11-17', by: maintainer, topic: blocker-B2, decision: 'GOZ-0006-B2: generate A2A v1.0.1 JSON Schema with A2A scripts/proto_to_json_schema.sh in a golang:1.25 Docker container (protoc, bufbuild protoc-gen-jsonschema v0.6.0, googleapis pinned) and compare with the published a2a.json.'}
- {at: '2026-11-17', by: maintainer, topic: schema-validator-revised, decision: 'P1 revised after GOZ-0006-B1 and the V5 spike: Corvus.Text.Json.Validator 5.8.11 (V5 runtime evaluator, no Roslyn) replaces Corvus.Json.Validator 5.8.11 (V4, run-time Roslyn compile, AsyncAPI 3.0.0 failed).'}
- {at: '2026-11-17', by: maintainer, topic: a2a-vendoring, decision: 'A2A schema vendored as the 47 unstitched per-message files from A2A generator (each $id = file name) instead of the stitched a2a.json, whose 33 relative $refs do not resolve.'}
- {at: '2026-11-17', by: maintainer, topic: schema-noise, decision: 'Separate real from false: when a failed subschema makes the validator report defined members as unknown, report a member as unknown_field only if the applicable schema really does not define it; never suppress a real unknown field (spec: all problems found are reported). Spike against Corvus first and report back before building. Replaces the unevaluated-noise agent choice, which was implemented without asking.'}
- {at: '2026-11-17', by: maintainer, topic: problems-per-location, decision: 'Keep all, amend contract: every distinct rule at a pointer is reported, ordered by category then rule (the same rule twice at one pointer collapses). The plan contract (manifest-validation.md, research R9) kept one problem per pointer, which contradicted spec.md edge case "all problems found are reported"; first asked with a wrong framing (agent said the one-per-pointer rule was its own deviation), re-asked with the contradiction stated, maintainer confirmed keep all. Contract and R9 amended.'}
- {at: '2026-11-17', by: maintainer, topic: reserved-matching, decision: 'Trailing words: a name is reserved when its normalized form or any trailing run of its words is in the vocabulary (catches x-gozleme-verified; also reserves names such as x-api-status in extension positions). Amend research R6 algorithm text to match.'}
- {at: '2026-11-17', by: agent, topic: schema-noise-spike, decision: 'Spike result (no code built): Corvus Detailed results contain failures only, never passing property evaluations, so "declared" cannot be read from results. Case: MCP tool with invalid title (5) and a real unknown member bogus: raw results report unevaluatedProperties for bogus, inputSchema and name; the current reduction hides all three, so the real unknown bogus is lost (defect confirmed). Proposed fix: resolve the failing unevaluatedProperties schema statically in the bundled documents (follow $ref, allOf, anyOf, oneOf, if/then/else, dependentSchemas) and collect properties names and patternProperties patterns; a reported member is a real unknown_field only if no declaration matches. Limit: a name declared only in a non-matching anyOf/oneOf branch counts as known. Awaiting maintainer go-ahead.'}
- {at: '2026-11-17', by: maintainer, topic: schema-noise-fix, decision: 'Build it: after the spike, resolve the failing unevaluatedProperties schema statically in the bundled documents and report a member as unknown_field only if no properties name or patternProperties pattern declares it; accepted limit: a name declared only in a non-matching anyOf/oneOf branch counts as known, pinned by a test that the overlays do not close objects through alternative branches.'}
- {at: '2026-11-17', by: agent, topic: schema-noise-build-finding, decision: 'Implementation finding, reported to the maintainer: the option text said a test would pin that the overlays do not close objects through alternative branches; that is false (server.json LocalTransport and Argument are anyOf with different names per branch, e.g. stdio vs HTTP url), so a stray url on a stdio transport would have been hidden. Built a narrower limit within the decision: anyOf/oneOf branches count only if the object validates against that branch alone; all branches count only when none matches (the alternative failure is then reported); an invalid document never yields zero problems. Corvus drops branch results inside a passing anyOf, so failure paths could not be used. Test SchemaNoiseTests proves the stdio url is reported and fails if all branches are counted.'}
- {at: '2026-11-17', by: maintainer, topic: secret-on-page, decision: 'Editor is exempt: "the value never appears on the page" covers everything Gozleme shows back (result, problems, messages, title, all page text outside the editor); the manifest editor keeps the publisher own text. spec.md US2 scenario 3 clarified; demo test scans the page with the editor removed.'}
- {at: '2026-11-17', by: agent, topic: demo-trace-queries, decision: 'Test harness fix, no behaviour change: GOZ-0001 sign_in and GOZ-0002 org_create observability checks queried 50 unfiltered browser traces; with GOZ-0006 traffic (145 browser traces in the window) the target traces fell outside the cap. Both now filter by operation.'}
- {at: '2026-11-17', by: maintainer, topic: yaml-comment-secrets, decision: 'Scan raw text: run the credential pattern list over every line of raw YAML (OpenAPI/AsyncAPI) and SKILL.md front matter, like the SKILL.md body; a hit is secret_value at line:column. Amend R7. (convergence, security review F3)'}
- {at: '2026-11-17', by: maintainer, topic: reserved-name-hardening, supersededBy: 'lookalike-folding (NFKC part only: the platform has no NFKC under InvariantGlobalization)', decision: 'Harden all: split camelCase into words, NFKC, strip default-ignorable code points, any non-alphanumeric is a separator, then trailing-word matching (x-verifiedBy still passes). Amend R6 and the contract. (security review F5)'}
- {at: '2026-11-17', by: maintainer, topic: native-deprecated-A1, decision: 'Allow native flag: approves agent choice A1; an OpenAPI/AsyncAPI element deprecated flag is protocol metadata, not a publisher lifecycle claim; publisher lifecycle claims in envelope and extension positions stay reserved.'}
- {at: '2026-11-17', by: maintainer, topic: a2a-provider, decision: 'Allow, never trust: A2A provider is descriptive, kept verbatim, never projected or trusted as owner; ownership comes only from the capability/publisher; document in the adapter field list.'}
- {at: '2026-11-17', by: maintainer, topic: openapi-external-links, decision: 'Allow both: OpenAPI Example externalValue and Link operationRef pointing at another document are informational URLs under R10 (kept verbatim, never fetched, never projected). T080, which the agent appended without asking, is not built. Record in the format contract with T082.'}
- {at: '2026-11-17', by: maintainer, topic: numeric-scalar-cap, supersededBy: numeric-scalar-cap-corrected, decision: 'Reject as malformed: chosen from an option whose stated reason was wrong (the agent said the other parser bounds are malformed; they are too_large with no location). Re-asked.'}
- {at: '2026-11-17', by: maintainer, topic: lookalike-folding, supersededBy: 'lookalike-cyrillic-greek (the Greek/Cyrillic exclusion only)', decision: 'Built-in fold table (option 1): the platform runs with InvariantGlobalization, where .NET applies no NFKC, so look-alike characters are folded by a generated table (fullwidth, roman numerals, math/letterlike, enclosed, super/subscripts, modifier letters, ligatures, accented Latin, dotless i); not full NFKC, Greek/Cyrillic homoglyphs not folded; limit documented in R6. No platform change.'}
- {at: '2026-11-17', by: maintainer, topic: numeric-scalar-cap-corrected, decision: 'too_large, like name length: a JSON or YAML number longer than 1,024 characters is rule bound.number, category too_large, no location, refused before any conversion (T079).'}
- {at: '2026-11-17', by: maintainer, topic: lookalike-cyrillic-greek, decision: 'Add official look-alike list: extend the fold table with Unicode TR39 confusables (pinned version and digest) for single Cyrillic and Greek letters whose confusable skeleton is ASCII letters or digits. The agent had not mentioned the Cyrillic/Greek gap when offering the fold-table option; raised by a side note and re-asked.'}
- {at: '2026-11-17', by: maintainer, topic: data-key-skip-by-position, decision: 'Skip by position: example/examples/default/enum/const are skipped only where they hold sample data (schema keyword values, parameter/media/header examples); structural positions such as responses.default, components.examples entries and schemas or parameters named default/enum are checked for external references and reserved x- names. (convergence C1/C2, security F4)'}
- {at: '2026-11-17', by: maintainer, topic: example-object-extensions, decision: 'Check them: banned x- names on an OpenAPI Example object itself are reserved_claim; only its value is sample data.'}
- {at: '2026-11-17', by: maintainer, topic: deep-document-bound, decision: 'New limit + no crash: a too_large bound on the length of one location (pointer), proposed 4,096 characters, checked while reading; any validator results overflow is too_large instead of a 500. (security F2, N2)'}
- {at: '2026-11-17', by: maintainer, topic: reserved-closed-objects, decision: 'Follow the contract: banned names in any closed object of A2A, OpenAPI and AsyncAPI also get reserved_claim beside unknown_field; amend research R6. (convergence C3)'}
- {at: '2026-11-17', by: maintainer, topic: projection-map-order, decision: 'Spec wins: projection entries derived from maps (paths, channels, operations) are listed in a fixed sorted order so key order never changes the projection (SC-003, US3/AC2); amend projection-v1.md. (convergence C4)'}
- {at: '2026-11-17', by: maintainer, topic: reserved-dotted-names, decision: 'Check whole name too: besides the part after the namespace cut, the whole name is checked with dots as word separators, and an empty remainder uses the whole name (x-trust.level, x-verified. reserved; x-owned.by flips to reserved). (convergence C5)'}
- {at: '2026-11-17', by: maintainer, topic: malformed-envelope-locations, decision: 'Amend docs: parse.not-string and the encoding-mismatch parse.syntax keep pointing at the faulty envelope field; FR-012, manifest-validation.md and R9 allow a pointer for these two. (convergence C6)'}
- {at: '2026-11-17', by: maintainer, topic: lookalike-fillers-latin, decision: 'Both: remove all Unicode default-ignorable code points (incl. Hangul fillers U+115F, U+1160, U+3164, U+FFA0) as R6 states, and add Latin-script look-alikes from the pinned TR39 confusables 18.0.0. (security F5)'}
- {at: '2026-11-17', by: maintainer, topic: joined-name-credentials, supersededBy: 'joined-names-patterns (pattern scope only)', decision: 'Reject and trim: every location''s joined text is checked against the credential patterns; where it first matches, the document is rejected with secret_value (secret.name) at the deepest parent whose location is still clean, and no reported location carries the joined credential. (security re-review note; the agent had listed it as not acted on and was asked to raise it)'}
- {at: '2026-11-17', by: maintainer, topic: joined-names-patterns, decision: 'Drop the header pattern: joined locations are checked only for credentials that need names joined to exist (url-userinfo, azure AccountKey=/SharedAccessKey=/SharedAccessSignature=); Bearer/Basic/Digest tokens are still caught in single names and values. Narrows joined-name-credentials after the agent''s T091 caused false positives (basic info/description).'}
- {at: '2026-11-17', by: maintainer, topic: data-positions-gaps, decision: 'Close both: Callback object entries are a map; draft-07 dependencies is a schema map. (confirmation security review 4)'}
- {at: '2026-11-17', by: maintainer, topic: data-positions-literal, decision: 'Treat as data: an OpenAPI Link requestBody and parameters values are literal data; in a bare JSON Schema an object-valued examples is skipped like an array. (confirmation security review 5)'}
- {at: '2026-11-17', by: maintainer, topic: model-card-nested-reserved, decision: 'Extend to nested: banned names in the model card closed nested objects (modalities, limits) get reserved_claim beside unknown_field. (confirmation convergence F3)'}
- {at: '2026-11-17', by: maintainer, topic: results-overflow-catch, decision: 'Narrow + log: only the validator result-buffer overflow (matched by where it is thrown) becomes bound.results too_large, with a warning log without document content; any other exception still fails as a 500. (confirmation F6)'}
- {at: '2026-11-18', by: maintainer, topic: stored-text-projection-only, decision: 'Projection-only by default (GOZ-0006-IF-05): later specs search and embed projection fields only; raw native text stays stored and exportable as sent; indexing or embedding raw text needs its own decision.'}
- {at: '2026-11-18', by: maintainer, topic: agent-choices-ratified, decision: 'Ratified as built (GOZ-0006-IF-13 walk-through): no-audit, lifecycle-claims, encoding-value (markdown), secret-reference-form (A2), a2a-required, corvus-analyzers, yaml-non-finite, unavailable-outcome, mcp-meta-serverinfo, missing-member-location (to be written into the validation contract). action-resource: keep manifest.validate on the capability resource for now; a manifest resource type is introduced in GOZ-0007 when manifests are stored.'}
- {at: '2026-11-18', by: maintainer, topic: result-status-codes, decision: 'Replaces A3: accepted answers 200; a malformed document answers 400 and a too-large document 413, both with the usual rejected result body (one problem); every other rejected outcome answers 422 with the result body. A request body over 1 MiB keeps 413 {"error":"too_large"}.'}
- {at: '2026-11-18', by: maintainer, topic: shared-rate-limit, decision: 'Replaces rate-limit: the validation rate limit is shared across API instances through a PostgreSQL counter table (account, window, count; no manifest data) with a migration; FR-017 is clarified to allow rate-limit counters that hold no manifest data; the no-table test allows this one table. Other limits (invitation redeem) stay as they are (GOZ-0005-IF-05).'}
agentChoices:
- {at: '2026-11-17', topic: release-analyzer, choice: 'environment finding, not a behaviour choice: the Corvus.Text.Json CTJ001 analyzer loads in the container/CI restore but not in the local restore (assets list no analyzers even after --force-evaluate), so Release-only analyzer errors surfaced only in docker compose build; fixed with UTF-8 literals; verify the container build before each demo.'}
- {at: '2026-11-17', topic: action-resource, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'action manifest.validate on the existing capability resource (no new resource type); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: no-audit, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'validation changes nothing so it writes no new audit event (authz denials keep 1301); range 1501-1510 stays free; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: lifecycle-claims, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'publisher-asserted lifecycle state (deprecated, revoked) is treated as a reserved claim alongside the Q4 list; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: encoding-value, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'envelope native encoding value for SKILL.md is markdown; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: deprecated-not-reserved, supersededBy: maintainer decision 2026-11-17 (native-deprecated-A1), choice: 'A1: protocol-native deprecated flags on OpenAPI/AsyncAPI elements are element metadata, not a publisher lifecycle claim, so not reserved; the reserved vocabulary applies only to envelope names, extension-point names and adapter-listed fields (research R6); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: secret-reference-form, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'A2: manifest secret reference v1 is secretref:<provider>/<key>, plus MCP {NAME} placeholders and empty declarations; a later secrets spec may supersede it with a new version; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: result-status, supersededBy: 'result-status-codes (2026-11-18)', choice: 'A3: validation answers 200 for both outcome accepted and outcome rejected; authorization and transport failures keep 403/404/409/413/415/429/503; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: a2a-required, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'protoc-gen-jsonschema drops the 61 field_behavior REQUIRED annotations in a2a.proto; the Gozleme A2A strict overlay restates them as required lists from the proto (normative source); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: corvus-analyzers, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'Corvus.Text.Json CTJ* analyzers removed from compilation repo-wide in Directory.Build.targets because they flag unrelated code (Guid.Parse, System.Text.Json) as errors; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: yaml-non-finite, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'YAML core-schema .inf and .nan have no JSON form, so the restricted YAML reader keeps them as strings; other core-schema numbers are normalized to JSON (0x1F -> 31, .5 -> 0.5); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: unevaluated-noise, supersededBy: maintainer decision 2026-11-17, choice: 'schema failures are reduced to leaf keywords; an unevaluatedProperties finding is dropped when another schema failure lies at or beneath the same object, because a failed subschema discards its annotations (members would be reported unknown when merely invalid); the member is reported on the next attempt; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: one-problem-per-location, supersededBy: maintainer decision 2026-11-17 (problems-per-location), choice: 'one problem is kept per location: reserved_claim or secret_value first, otherwise the first category in contract order; problems whose pointer has a credential-shaped segment are dropped because the secret.name problem at the parent reports them; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: unavailable-outcome, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'the 503 exit records telemetry outcome unavailable, beyond the eight outcomes listed in research R16, so every exit sets the span outcome (T020); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: mcp-meta-serverinfo, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'upstream MCP Implementation has no _meta; the strict overlay allows _meta on serverInfo because contracts/native-formats.md lists it as an extension point; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: reserved-trailing-words, supersededBy: maintainer decision 2026-11-17, choice: 'research R6 is inconsistent: its normalization turns x-gozleme-verified into gozlemeverified, which is not in the vocabulary, yet its rationale says that name must match. A name is therefore reserved when its normalized form or any trailing run of its words is in the vocabulary (x-gozleme-verified -> verified). Fail-closed reading of both statements; it also reserves names such as x-api-status in extension positions. Pending maintainer confirmation; not a maintainer decision.'}
- {at: '2026-11-17', topic: missing-member-location, ratifiedBy: 'agent-choices-ratified (2026-11-18)', choice: 'a missing required native member is located at its would-be pointer (for example /skills), the convention envelope.required already uses; the contract does not say; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: mcp-capability-overlay-refs, choice: 'verified at implementation: a closed nested capability object in the MCP strict overlays must $ref its upstream subschema, or unevaluatedProperties rejects upstream members such as tools.listChanged; overlays fixed and digests re-pinned.'}
- {at: '2026-11-17', topic: rate-limit, supersededBy: 'shared-rate-limit (2026-11-18)', choice: 'validation rate-limited per account in memory per API instance (stateless operation, no shared budget); disclosed to the maintainer for veto.'}
