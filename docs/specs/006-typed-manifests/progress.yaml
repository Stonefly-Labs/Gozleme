decisions:
- {at: '2026-11-17', by: maintainer, topic: persistence, decision: 'Q1 option A: validate only; a manifest is validated against a registered capability (identity claim checked) and returns envelope, verbatim native document and a separate normalized projection; nothing is stored; GOZ-0007 adds storage as immutable revisions.'}
- {at: '2026-11-17', by: maintainer, topic: action-role, decision: 'Q2 option A: new action manifest.validate held by publisher only; suspended publishers answer 409.'}
- {at: '2026-11-17', by: maintainer, topic: native-formats, decision: 'Q3 option A: MCP Registry server.json; A2A Agent Card (current stable); OpenAPI 3.1 plus 3.0; AsyncAPI 3.0; Agent Skills SKILL.md front matter; Gozleme-defined typed model card; one pinned version per adapter, later versions added as new adapter versions; plan pins exact versions.'}
- {at: '2026-11-17', by: maintainer, topic: strictness, decision: 'Q4 option A: strict categorized rejection; envelope rejects unknown fields; reserved security claims (signatures, attestations, trust/verified/approved status, delegation and transfer chains, visibility and grants, owner/publisher overrides) rejected; inline secret values rejected, secret references allowed; native unknown fields allowed only under the protocol extension mechanism, preserved verbatim, never projected.'}
- {at: '2026-11-17', by: maintainer, topic: native-carriage, decision: 'Clarify Q1 option A: native document always a string in the envelope; native bytes are its UTF-8; digest over exactly those bytes.'}
- {at: '2026-11-17', by: maintainer, topic: native-encoding, decision: 'Clarify Q2 option A: OpenAPI and AsyncAPI accept JSON or restricted YAML; server.json, A2A Agent Card and model card JSON only; envelope declares native encoding; mismatch is malformed.'}
- {at: '2026-11-17', by: maintainer, topic: secret-detection, decision: 'Clarify Q3 option A (first chose B with entropy heuristic, then reversed same session): non-empty values in secret-bearing fields plus a fixed documented credential pattern list in any field; no entropy heuristic.'}
- {at: '2026-11-17', by: maintainer, topic: problem-location, decision: 'Clarify Q4 option A: location is part (envelope|native) plus RFC 6901 JSON Pointer; malformed gives line/column in the native string; too_large has no location.'}
- {at: '2026-11-17', by: maintainer, topic: schema-validator, decision: 'Plan P1: Corvus.Json.Validator (Apache-2.0) validates native documents against bundled official schemas (drafts 4/7/2020-12); JsonSchema.Net rejected (OSMF EULA licence, no draft-04); hand-written validators rejected.'}
- {at: '2026-11-17', by: maintainer, topic: yaml-parser, decision: 'Plan P2: YamlDotNet low-level Parser event stream only; Gozleme rejects anchors, aliases, tags and merge keys and enforces duplicate keys, depth and size while building its own tree.'}
- {at: '2026-11-17', by: maintainer, topic: asyncapi-pin, decision: 'Plan P3: AsyncAPI 3.0.0 as decided in Q3; 3.1.0 (released 2026-01-31) is added later as a new adapter version.'}
- {at: '2026-11-17', by: maintainer, topic: mcp-format, decision: 'Plan P4: server.json 2025-12-11 lists no tools/resources/prompts and the maintainer asked for a more modern pin considering stateful and stateless MCP; chose "Revision-typed, both": a Gozleme-versioned MCP server manifest whose serverInfo, capabilities, tools, resources, resource templates and prompts are validated against the official core schema of the declared protocolRevision, 2026-07-28 (stateless, SEP-2575/2567) or 2025-11-25 (stateful, sessions); projection mode derived from the revision; optional remotes/packages use server.json 2025-12-11 shapes; primitive lists publisher-declared and advisory.'}
agentChoices:
- {at: '2026-11-17', topic: action-resource, choice: 'action manifest.validate on the existing capability resource (no new resource type); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: no-audit, choice: 'validation changes nothing so it writes no new audit event (authz denials keep 1301); range 1501-1510 stays free; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: lifecycle-claims, choice: 'publisher-asserted lifecycle state (deprecated, revoked) is treated as a reserved claim alongside the Q4 list; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: encoding-value, choice: 'envelope native encoding value for SKILL.md is markdown; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: deprecated-not-reserved, choice: 'A1: protocol-native deprecated flags on OpenAPI/AsyncAPI elements are element metadata, not a publisher lifecycle claim, so not reserved; the reserved vocabulary applies only to envelope names, extension-point names and adapter-listed fields (research R6); disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: secret-reference-form, choice: 'A2: manifest secret reference v1 is secretref:<provider>/<key>, plus MCP {NAME} placeholders and empty declarations; a later secrets spec may supersede it with a new version; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: result-status, choice: 'A3: validation answers 200 for both outcome accepted and outcome rejected; authorization and transport failures keep 403/404/409/413/415/429/503; disclosed to the maintainer for veto.'}
- {at: '2026-11-17', topic: rate-limit, choice: 'validation rate-limited per account in memory per API instance (stateless operation, no shared budget); disclosed to the maintainer for veto.'}
