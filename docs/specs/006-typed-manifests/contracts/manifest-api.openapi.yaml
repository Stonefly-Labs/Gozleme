openapi: 3.1.0
info:
  title: Gözleme Manifest Validation API — GOZ-0006
  version: "1"
  description: >
    Stateless manifest validation for a registered capability, organization-scoped under the Organizations
    API v1. Inherited: session required, Cache-Control no-store, x-gozleme-client on unsafe methods, the
    identical empty 404 for a malformed, unknown or non-member organization, 503 {"error":"unavailable"}
    while PostgreSQL is unreachable or the registry origin is not verified, 403 {"error":"forbidden"} when
    the caller's roles lack manifest.validate (docs/architecture/contracts/organization-permissions.md).
    Order: membership → permission → target → suspension → rate limit → media type/size → validation.
    Nothing is stored and no audit event is written. Validation rules: contracts/manifest-validation.md.
servers:
  - url: http://api:8080
security:
  - session: []
paths:
  /api/v1/organizations/{organizationId}/publishers/{publisherId}/capabilities/{capabilityId}/manifests/validate:
    parameters:
      - { name: organizationId, in: path, required: true, schema: { type: string } }
      - { name: publisherId, in: path, required: true, schema: { type: string } }
      - { name: capabilityId, in: path, required: true, schema: { type: string } }
    post:
      operationId: validateManifest
      x-gozleme-action: manifest.validate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './manifest-envelope-v1.schema.json' }
      responses:
        '200':
          description: Validation ran. outcome is accepted or rejected.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Accepted'
                  - $ref: '#/components/schemas/Rejected'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'Unknown, malformed, non-member or foreign organization, publisher or capability. Empty body.' }
        '409':
          description: The capability's publisher is suspended.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: suspended } } }
        '413':
          description: Request body over 1 MiB.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: too_large } } }
        '415':
          description: Content-Type is not application/json.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unsupported_media_type } } }
        '429':
          description: The account's validation budget is spent.
          headers: { Retry-After: { schema: { type: integer } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: rate_limited } } }
        '503':
          description: Database unreachable or registry origin not verified.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: unavailable } } }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: gozleme_session }
  responses:
    Forbidden:
      description: Member without manifest.validate.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { error: forbidden } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties: { error: { type: string } }
    Accepted:
      type: object
      additionalProperties: false
      required: [outcome, envelope, native, projection]
      properties:
        outcome: { const: accepted }
        envelope:
          description: The envelope without native.document.
          type: object
        native:
          type: object
          additionalProperties: false
          required: [format, formatVersion, encoding, document, digest, byteLength]
          properties:
            format: { type: string }
            formatVersion: { type: string }
            encoding: { enum: [json, yaml, markdown] }
            document: { type: string, description: 'The submitted native string, unchanged.' }
            digest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            byteLength: { type: integer, minimum: 0 }
        projection:
          description: Normalized projection v1 (contracts/projection-v1.md).
          type: object
    Rejected:
      type: object
      additionalProperties: false
      required: [outcome, problems, truncated]
      properties:
        outcome: { const: rejected }
        problems:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Problem' }
        truncated: { type: boolean }
    Problem:
      type: object
      additionalProperties: false
      required: [category, rule, location, message]
      properties:
        category:
          enum: [malformed, too_large, unsupported_version, unsupported_family, unsupported_format, unknown_field,
                 reserved_claim, secret_value, identity_mismatch, external_reference, invalid_value]
        rule: { type: string, description: 'Fixed rule ID from the v1 catalogue.' }
        message: { type: string, description: 'Fixed catalogue text; never contains submitted values.' }
        location:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [part, pointer]
              properties:
                part: { enum: [envelope, native] }
                pointer: { type: string, description: 'RFC 6901 JSON Pointer.' }
            - type: object
              additionalProperties: false
              required: [part, line, column]
              properties:
                part: { enum: [envelope, native] }
                line: { type: integer, minimum: 1 }
                column: { type: integer, minimum: 1 }
