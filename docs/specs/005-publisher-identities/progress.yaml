decisions:
- {at: '2026-11-16', by: maintainer, topic: origin, decision: 'Q1 option A: operator-configured origin recorded by the first migration as instance reference data; mismatched or missing configuration refuses migrate and start.'}
- {at: '2026-11-16', by: maintainer, topic: publisher-ownership, decision: 'Q2 option A: an organization owns many publishers; tenant-owned, private by default, never moved.'}
- {at: '2026-11-16', by: maintainer, topic: handle-uniqueness, decision: 'Q3 option A: handles unique instance-wide; a taken handle answers 409 unavailable revealing only reservation; registration rate-limited per account; every other constraint error maps to the unknown-ID 404.'}
- {at: '2026-11-16', by: maintainer, topic: canonical-id, decision: 'Q4 option A: canonical ID = origin + opaque permanent UUIDv7 (gz://<origin>/cap/<id>), never embedding organization ID or display name; friendly alias <handle>/<capability-name> reserved permanently, never reassigned or reused.'}
- {at: '2026-11-16', by: maintainer, topic: action-roles, decision: 'Q5 option A: publisher.register = admin; capability.create and capability display-name change = publisher; reads member-level.'}
- {at: '2026-11-16', by: maintainer, topic: initial-role, finding: GOZ-0004-IF-05, decision: 'Q6 option A: no change; creators keep {admin,member}; seed grants publisher to a demo account.'}
- {at: '2026-11-16', by: maintainer, topic: role-loss, finding: GOZ-0004-IF-05, decision: 'Q7 option A: publishers, IDs and aliases belong to the organization and are unaffected by losing a role or leaving.'}
- {at: '2026-11-16', by: maintainer, topic: mutability, decision: 'Q8 option A: only display names mutable; no retirement, deletion or alias release. Amended by Q9 for handles.'}
- {at: '2026-11-16', by: maintainer, topic: handle-squatting, decision: 'Q9 option A (raised after drafting from a squatting risk note): operator command line only can reserve handles (blocked, or earmarked for an organization by opaque ID) and reclaim a registered handle; reclaim suspends the holding publisher, its capabilities keep canonical IDs and their aliases stay retired forever; the handle may be re-registered; audited; no HTTP surface.'}
- {at: '2026-11-16', by: maintainer, topic: operator-reclaim-mechanism, finding: GOZ-0003-IF-04, decision: 'Q10 option A (clarify): handle claims, operator reservations and alias reservations are installation-owned claim tables whose unique constraints enforce instance-wide uniqueness; the app login may insert but not list other organizations entries; reclaim changes only the claim row and suspension is derived from claim loss, so no tenant row is touched from outside its tenant (FR-037).'}
- {at: '2026-11-16', by: maintainer, topic: operator-login, finding: GOZ-0003-IF-04, decision: 'Q11 option A (plan): operator handle commands (reserve, release, reclaim) connect as the owner login gozleme_migrator, which the operator already holds for migrate; the claim tables enable but do not force row security, so the owner is the installation authority over them while gozleme_app stays bound by policies; guard triggers bind the owner to the allowed one-way transitions. Rejected: a new gozleme_operator login (new secret, manual role creation on existing volumes) and dropping reclaim (reverses Q9).'}
- {at: '2026-11-16', by: maintainer, topic: registration-rate-limit-order, finding: analyze-U1, decision: 'publisher registration rate limit is acquired in the handler after AuthorizeAsync passes (member + admin), before validation; not RequireRateLimiting middleware. Non-members never get 429, refused attempts do not consume budget, audit 1405 names only a confirmed organization (research R8).'}
