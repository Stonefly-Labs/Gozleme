- {at: '2026-11-16', topic: browser-span-names, choice: 'browser spans use the existing gozleme.ui.<flow> convention (publisher_register, publisher_rename, capability_create, capability_rename) instead of gozleme.web.publisher.register / gozleme.web.capability.create named in T022; disclosed to the maintainer for veto.', disposition: pending}
