- {at: '2026-11-16', by: maintainer, topic: invitations, decision: 'Q2 option A: only admin may create, list and revoke invitations; a role change removing that permission revokes the account''s open invitations in the same transaction with audit 1104, as removal does.'}
- {at: '2026-11-16', by: maintainer, topic: rls-role-posture, decision: 'Q3 option B: row-level rules and guards restrict every admin-only write (rename, invitation writes, removal of other members, role changes) to admins of that organization. Any new privileged database helper this needs goes back to the maintainer as a security-review item before implementation.'}
- {at: '2026-11-16', by: maintainer, topic: inert-roles, decision: 'Q4 option A: publisher, reviewer and approver permit exactly what member permits in this slice; no role implies another (admin does not hold them implicitly).'}
- {at: '2026-11-16', by: maintainer, topic: role-storage, decision: 'Q5 option B: a set of roles held in the membership row (first answered C, a separate table; corrected to B the same day). The option-B initial-role rule applies unchanged via schema default.'}
- {at: '2026-11-16', by: maintainer, topic: later-role-db-enforcement, finding: GOZ-0004-IF-02, decision: 'Option A: every later role-gated write is also enforced in the database via a non-definer account_has_role(org, role) generalising account_is_admin; reads stay member-level at the database; GOZ-0018 conditions stay application-only.'}
- {at: '2026-11-16', by: maintainer, topic: permission-contract-location, finding: GOZ-0004-IF-13, decision: 'Option B: contract moved in this PR to docs/architecture/contracts/organization-permissions.md (living; later specs edit it in their own slice); OrganizationPermissionContractTests reads the new path.'}
