- {at: '2026-11-16', by: maintainer, topic: initial-role-rule, decision: 'Option B (recorded before drafting, PR #16): no data migration; existing memberships get the managing role by schema default, which then changes to the least-privileged role; new creators manage, invitees get least privilege; seed sets fixed demo roles as a seeded member.'}
