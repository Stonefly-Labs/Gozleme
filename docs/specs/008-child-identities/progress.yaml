- {at: '2026-11-19', by: maintainer, topic: generation-scope, decision: 'Q3 option B: generation 1 recorded for every revision plus an owner-login operator re-projection command (no API route) adding additive unattested generation N+1 that keeps child IDs.'}
- {at: '2026-11-19', by: maintainer, topic: preexisting-duplicates, decision: 'Clarify Q1 option A: at install, first duplicate entry by stored-projection position takes the kind + native name child; each further duplicate gets a new duplicate-marked child that matching never selects (FR-016a).'}
- {at: '2026-11-19', by: maintainer, topic: identical-reprojection, decision: 'Clarify Q2 option A: byte-identical re-projection still records generation N+1, reports digest equal to previous generation, exits 0 (FR-011a, US3 scenario 7).'}
- {at: '2026-11-19', by: maintainer, topic: operator-read-branch, decision: 'A2 approved (security): add WHEN gozleme.is_operator() THEN true to manifest_revisions_select for the migrate install step and projection-regenerate.'}
- {at: '2026-11-19', by: maintainer, topic: regenerate-validation, decision: 'A4 approved: projection-regenerate does not re-run GOZ-0006 validation rules; checks native digest, parses, projects and compares the entry key multiset.'}
- {at: '2026-11-19', by: maintainer, topic: rollout-gap, decision: 'A7 approved: publication to a capability with a revision lacking generation 1 answers 503 unavailable under the capability lock and stores nothing.'}
- {at: '2026-11-19', by: maintainer, topic: generation-titles, decision: 'A8 approved: child revision records and child views use generation 1 titles; later-generation titles appear only in that generation bytes.'}
- {at: '2026-11-19', by: maintainer, topic: native-name-bound, decision: 'Implement-time question (verbatim choice "No bound; hashed index (Recommended)"): native_name has no length CHECK (validate bounds neither value names nor derived "<METHOD> <path>" names to 1,024 and does not guarantee non-empty); the partial unique match index keys on (capability_id, kind, native_name_digest), a sha256 of the UTF-8 name set by the insert guard; the entry check still compares the full native_name exactly; publication accepts everything validate accepts except duplicate keys.'}
- {at: '2026-11-19', by: maintainer, topic: child-insert-policy, decision: 'Convergence F2 (security, verbatim choice "Tighten policy (Recommended)"): member insert branches of the three child tables also require the revision published in this transaction (published_by = current account and published_at = now()); operator branch unchanged.'}
- {at: '2026-11-19', by: maintainer, topic: nul-character, decision: 'Convergence F3 (verbatim choice "Publish rule + skip (Recommended)"): if a test confirms \\u0000 breaks publication or install, add publish rule publish.nul_character (422, validate unchanged); install step skips such a revision, audits it by ID only and continues; map 22P05/22021 to unavailable.'}
- {at: '2026-11-19', by: maintainer, topic: child-refusal-status, decision: 'Convergence F4 (verbatim choice "503, documented (Recommended)"): a database refusal of a child row at publication (insert or commit-time completeness) answers 503 unavailable with nothing stored; documented in publish-delta.md.'}
- {at: '2026-11-19', by: maintainer, topic: regenerate-not-installed, decision: 'Convergence F14 (verbatim choice "Exit 3 not_installed (Recommended)"): projection-regenerate on a revision without generation 1 exits 3 with fixed word not_installed and audit 1602.'}
- {at: '2026-11-19', by: maintainer, topic: nul-pointer, decision: 'Implement-time question after T069 confirmed F3 (U+0000 answered 500 with 22021 in entry names/titles and 22P05 in the projection top-level title/description; validate accepts all), verbatim choice "Exact string pointer (Recommended)": one publish.nul_character problem per projection string holding U+0000, at that string''s exact pointer (/title, /description, /entries/<i>/nativeName, /entries/<i>/title, /attributes/...), no value echoed; duplicates first, then U+0000 problems, in one 422.'}
- {at: '2026-11-19', by: maintainer, topic: envelope-nul, decision: 'Convergence pass 2 (C2-1/SEC-3: envelope title/summary U+0000 passed validate and answered 503 at publish, envelope_summary jsonb), verbatim choice "Extend rule to envelope (Recommended)": publish.nul_character also reports envelope strings holding U+0000 at part envelope with the exact pointer (/title, /summary), 422; validate unchanged; the 22P05/22021 -> 503 mapping stays as defence in depth.'}
