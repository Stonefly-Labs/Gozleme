decisions:
- {at: '2026-11-18', by: maintainer, topic: key-custody, decision: 'Q1 option A: registry-held signing key per publisher; Gozleme signs on the publisher''s behalf when an authorized publisher member publishes; private keys encrypted under a key-encryption key from a Secret reference (never database-only or Data Protection); stated limit: proves registry origin accepted the revision from publisher P, not publisher-held key; GOZ-0029 pins these per-publisher public keys.'}
- {at: '2026-11-18', by: maintainer, topic: attestation-coverage, decision: 'Q2 option A: statement covers canonical capability and publisher IDs, origin, version, native sha256 digest and byteLength, adapter id and version, projectionVersion, and sha256 of the projection canonical byte-deterministic serialization (GOZ-0006-IF-08).'}
- {at: '2026-11-18', by: maintainer, topic: suspension, decision: 'Q3 option A: a suspended publisher''s existing revisions and attestations stay readable by members, verifiable and frozen, shown as suspended; new revisions refused with 409 suspended in the API and write policy (GOZ-0005-IF-08).'}
- {at: '2026-11-18', by: maintainer, topic: manifest-resource, decision: 'Q4 option A: new manifest resource with manifest.publish (publisher only, held-claim check in write policy), member-level manifest.list and manifest.read; manifest.validate moves from capability to manifest with role and behaviour unchanged (GOZ-0006-IF-03, IF-13).'}
- {at: '2026-11-18', by: maintainer, topic: key-succession, decision: 'Q5 option A (raised after drafting by a side-agent note: one key for life plus a lost or leaked key-encryption key would block publishing for good): add-only key succession; an operator command (no API route) adds a new publisher signing key and retires the current one with time and reason (lost, compromised); old keys never changed or deleted and still verify their revisions; also recovers a lost key-encryption key; API/UI rotation, signature revocation and cross-registry key replacement stay with GOZ-0033/GOZ-0039; peers must not trust a succession without their own check (GOZ-0029, CR-05).'}
- {at: '2026-11-18', by: maintainer, topic: identical-replay, decision: 'clarify Q option A: republishing an existing version is always 409 version_exists, even with identical content; no idempotent success and no idempotency key; clients recover by listing.'}
- {at: '2026-11-18', by: maintainer, topic: version-ordering, decision: 'clarify Q option A: versions may be published in any order, unique only by SemVer 2.0.0 precedence; lists ordered by publication sequence; no latest designation (GOZ-0026, GOZ-0027).'}
- {at: '2026-11-18', by: maintainer, topic: key-creation, decision: 'clarify Q option A: a publisher signing key is created lazily inside its first publication transaction; publisher registration (GOZ-0005) unchanged; concurrent first publications create exactly one key.'}
- {at: '2026-11-18', by: maintainer, topic: signing-library, decision: 'Plan P1: Ed25519 through NSec.Cryptography 26.4.0 (MIT; libsodium 1.0.22, ISC); .NET 10 BCL has no standalone Ed25519 (only composite ML-DSA); BouncyCastle 2.7.0 and built-in ECDSA P-256 (non-deterministic) rejected.'}
- {at: '2026-11-18', by: maintainer, topic: signed-bytes, decision: 'Plan P2: raw Ed25519 signature over the RFC 8785 (JCS) canonical bytes of statement v1, no envelope; DSSE PAE framing rejected (extra step for independent verifiers), possible as a later statement version.'}
agentChoices:
- {at: '2026-11-18', topic: adapter-split, choice: 'A1: GOZ-0006 adapter id mcp/1 is recorded and signed as adapter.id mcp and adapter.version 1 (research R4); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: key-id, choice: 'A2: key.id is sha256 of the 32-byte raw public key, so anyone can recompute it; rows also carry an opaque uuid for routes (R5); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: no-account-fk, choice: 'A3: published_by and created_by are opaque account uuids without a foreign key to users, pinned to current_account_id() by policy, so immutability never blocks a future account erasure (R11; security-review item); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: conflict-bodies, choice: 'A4: version_exists and suspended are 409 with {error} bodies; publish answers 201 with the revision detail and Location (R12); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: key-read-action, choice: 'A5: signing-key list and public-key download use manifest.read; no signing-key resource (R13); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: no-verify-endpoint, choice: 'A6: no public endpoint verifies arbitrary submitted statements; US4 refusals are proven on the pure verifier in unit tests and on superuser-tampered stored rows (R13); ratified by maintainer 2026-11-18.'}
- {at: '2026-11-18', topic: seed-no-revision, choice: 'A7: the seed creates no revision and needs no KEK (ratified); maintainer ruled 2026-11-18 that stories 1, 2 and 4 publish to the seeded capability manifest-demo with run-unique pre-release versions (1.0.0-r<runid>), not a run-unique capability, matching US1; rename, reclaim and succession keep run-unique publishers (R18).'}
- {at: '2026-11-18', topic: operator-span-name, choice: 'A8: maintainer ruled 2026-11-18 that the succession span is gozleme.operator.signing_key_succession, through PublisherTelemetry.StartOperator like the GOZ-0005 handle spans; research.md, quickstart.md and tasks.md corrected from the hyphenated spelling.'}
- {at: '2026-11-18', topic: helm-kek-optional, choice: 'A9: maintainer ruled 2026-11-18 that the KEK secretKeyRef stays optional on both the API and the migrate Job; a succession Job without the KEK exits 1 and commits nothing.'}
- {at: '2026-11-18', topic: proof-source, choice: 'A10: maintainer ruled 2026-11-18 that the revision page renders the API attestation.proof (single source); the web copy of the R17 wording exists only for the wording tests.'}
disclosures:
- 'List paging: the contract allows limit 1-100 (default 50) and after >= 0 and defines no 400 for the list, so an out-of-range or non-integer limit is clamped or defaulted and an invalid after is treated as 0.'
- 'signing-key-succession --undecryptable succeeds every undecryptable publisher in one transaction, so exit 1 commits nothing (contract exit table); each succession is still under its own per-publisher exclusive lock.'
- 'RlsCatalog is unchanged: its existing definer and PUBLIC-execute checks already cover is_operator() and the new guard functions (The_migrated_database_has_no_violations passes).'
- 'The shared RLS matrix expects the owner login without an account context to see the four revision tables (is_operator select branch); RevisionIsolationTests pins is_operator() exactly.'
- 'ActiveKeyForSigningAsync also excludes retired keys (defence in depth; the guards already make the highest generation the unretired one); a retired-only key set fails closed with 503.'
- 'The independent openssl pkeyutl -rawin check in RevisionDownloadTests runs only where OpenSSL 3 is installed (CI ubuntu); LibreSSL on macOS lacks -rawin and the check is skipped there; NSec PEM import + verify always runs.'
- 'Route matching is case-insensitive (ASP.NET Core), so /Native serves the native part like /native; any other part name answers 404.'
- 'UI copy other than the fixed R17 proof wording (reason and error messages, banners, "No key yet") is implementation wording, not pinned in the contracts.'
