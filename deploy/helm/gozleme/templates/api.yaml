apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gozleme.fullname" . }}-api
  labels:
    {{- include "gozleme.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "gozleme.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gozleme.selector" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "gozleme.otelEnv" (dict "root" . "protocol" "grpc") | nindent 12 }}
            - name: Gozleme__BuildVersion
              value: {{ .Values.buildVersion | quote }}
            - name: ConnectionStrings__Gozleme
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: app-connection-string
            - name: Gozleme__Rls__ContextKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: rls-context-key
            - name: Gozleme__Signing__KeyEncryptionKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.signing.existingSecret }}
                  key: signing-key-encryption-key
                  optional: true
            - name: Gozleme__Registry__Origin
              value: {{ required "registry.origin is required: the permanent registry origin host name (GOZ-0005)" .Values.registry.origin | quote }}
            - name: Gozleme__Auth__RegistrationEnabled
              value: {{ .Values.auth.registrationEnabled | quote }}
            - name: Gozleme__Auth__SecureCookies
              value: {{ .Values.auth.secureCookies | quote }}
            - name: Gozleme__Network__TrustedProxies
              value: {{ .Values.network.trustedProxies | quote }}
            - name: Gozleme__Organizations__InvitationExpiryHours
              value: {{ .Values.organizations.invitationExpiryHours | quote }}
            - name: Gozleme__Organizations__RedeemPerMinute
              value: {{ .Values.organizations.redeemPerMinute | quote }}
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gozleme.fullname" . }}-api
  labels:
    {{- include "gozleme.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gozleme.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
