{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gozleme.fullname" . }}-migrate
  labels:
    {{- include "gozleme.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "gozleme.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            {{- include "gozleme.otelEnv" (dict "root" . "protocol" "grpc") | nindent 12 }}
            - name: Gozleme__BuildVersion
              value: {{ .Values.buildVersion | quote }}
            - name: ConnectionStrings__GozlemeMigrator
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: migrator-connection-string
            - name: Gozleme__Rls__ContextKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: rls-context-key
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
