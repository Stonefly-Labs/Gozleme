# GOZ-0000 foundation chart. PostgreSQL is operator-provided (not bundled); see README.md.
image:
  api:
    repository: gozleme-api
    tag: local
  web:
    repository: gozleme-web
    tag: local
  pullPolicy: IfNotPresent

buildVersion: "0.1.0"

database:
  # Name of an existing Secret with keys `app-connection-string` (gozleme_app role) and
  # `migrator-connection-string` (gozleme_migrator role). Credentials are never placed in values.
  existingSecret: gozleme-database

# Foundational OpenTelemetry (GOZ-0000-IF-11). Point at your collector; empty disables export
# (instrumentation still runs). gRPC for the .NET services, OTLP/HTTP for the web tier.
telemetry:
  otlpGrpcEndpoint: ""
  otlpHttpEndpoint: ""
  environment: production

# Local identity (GOZ-0001). Serve the web tier over HTTPS: session cookies are Secure by default.
auth:
  registrationEnabled: true
  secureCookies: true
# CIDRs whose X-Forwarded-For the API trusts (the web pods' network). Empty = loopback only, so all
# clients share one rate-limit budget per web pod (fails safe). See README "Client addresses".
network:
  trustedProxies: ""

migrate:
  enabled: true
  backoffLimit: 6

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

service:
  type: ClusterIP

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
