# GOZ-0000 foundation chart. PostgreSQL is operator-provided (not bundled); see README.md.
image:
  api:
    repository: gozleme-api
    tag: local
  web:
    repository: gozleme-web
    tag: local
  pullPolicy: IfNotPresent

buildVersion: "0.1.0"

database:
  # Name of an existing Secret with keys `app-connection-string` (gozleme_app role) and
  # `migrator-connection-string` (gozleme_migrator role). Credentials are never placed in values.
  existingSecret: gozleme-database

migrate:
  enabled: true
  backoffLimit: 6

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

service:
  type: ClusterIP

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
