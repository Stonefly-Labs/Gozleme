# GOZ-0000 foundation chart. PostgreSQL is operator-provided (not bundled); see README.md.
image:
  api:
    repository: gozleme-api
    tag: local
  web:
    repository: gozleme-web
    tag: local
  pullPolicy: IfNotPresent

buildVersion: "0.1.0"

database:
  # Name of an existing Secret with keys `app-connection-string` (gozleme_app role),
  # `migrator-connection-string` (gozleme_migrator role) and `rls-context-key` (GOZ-0003: tenant context
  # signing key, at least 32 characters, shared by the API and the migrator). Credentials are never placed in values.
  existingSecret: gozleme-database

# Foundational OpenTelemetry (GOZ-0000-IF-11). Point at your collector; empty disables export
# (instrumentation still runs). gRPC for the .NET services, OTLP/HTTP for the web tier.
telemetry:
  otlpGrpcEndpoint: ""
  otlpHttpEndpoint: ""
  environment: production

# Local identity (GOZ-0001). Serve the web tier over HTTPS: session cookies are Secure by default.
auth:
  registrationEnabled: true
  secureCookies: true
# CIDRs whose X-Forwarded-For the API trusts (the web pods' network). Empty = loopback only, so all
# clients share one rate-limit budget per web pod (fails safe). See README "Client addresses".
network:
  trustedProxies: ""
# Organizations (GOZ-0002): invitation lifetime (1-720 h) and per-account redemption attempts per minute (1-100).
organizations:
  invitationExpiryHours: 168
  redeemPerMinute: 10

# Registry origin (GOZ-0005), required: a lowercase host name such as registry.example.com. The migration
# Job records it once and every canonical ID embeds it (gz://<origin>/cap/<id>). It can never change: a
# different value later makes the migration Job and the API refuse to start.
registry:
  origin: ""

migrate:
  enabled: true
  backoffLimit: 6

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

web:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

service:
  type: ClusterIP

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }
